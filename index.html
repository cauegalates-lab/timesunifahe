<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#031638">
  <meta name="description" content="Painel de performance comercial por equipes da UNIFAHE.">
  <title>Performance Comercial | UNIFAHE</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="favicon-unifahe.png">
  <style>
    :root {
      --navy-950: #020d22;
      --navy-900: #031638;
      --navy-850: #061d48;
      --navy-800: #08285c;
      --blue: #0867e8;
      --blue-light: #2b91ff;
      --orange: #ff7200;
      --orange-light: #ffad28;
      --white: #f8fbff;
      --muted: #a8bad4;
      --success: #24df8d;
      --danger: #ff5f6d;
      --line: rgba(45, 129, 255, .42);
      --surface: rgba(5, 35, 83, .88);
      --surface-2: rgba(2, 18, 48, .94);
      --shadow: 0 20px 46px rgba(0, 0, 0, .36);
      --page-gap: clamp(9px, 1.25vh, 14px);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--navy-950);
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
      color: var(--white);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 22%, rgba(0, 99, 255, .24), transparent 28%),
        radial-gradient(circle at 92% 18%, rgba(255, 101, 0, .16), transparent 22%),
        linear-gradient(145deg, #020d22 0%, #031638 45%, #051a3f 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      opacity: .22;
      background-image:
        radial-gradient(circle, rgba(47, 144, 255, .75) 1px, transparent 1.5px),
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 24px 24px, 44px 44px, 44px 44px;
      background-position: 86% 4%, 0 0, 0 0;
      mask-image: linear-gradient(to bottom, black 0%, transparent 76%);
    }

    body::after {
      background: linear-gradient(105deg, transparent 0 48%, rgba(33, 113, 255, .035) 50%, transparent 52% 100%);
    }

    button, select { font: inherit; }

    .shell {
      position: relative;
      z-index: 1;
      width: min(1880px, calc(100% - clamp(18px, 2vw, 34px)));
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: clamp(8px, 1.35vh, 16px) 0 clamp(18px, 2vh, 28px);
    }

    .decor-corner { display: none; }

    .layout {
      width: 100%;
      min-height: calc(100vh - clamp(28px, 3vh, 44px));
      min-height: calc(100dvh - clamp(28px, 3vh, 44px));
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: var(--page-gap);
    }

    .topbar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: clamp(84px, 10vh, 108px);
      padding: clamp(11px, 1.5vh, 18px) clamp(18px, 2vw, 30px);
      overflow: hidden;
      border: 1px solid rgba(45, 129, 255, .55);
      border-bottom-color: rgba(255, 121, 0, .62);
      border-radius: 18px 18px 6px 6px;
      background:
        linear-gradient(115deg, rgba(5, 35, 83, .96), rgba(2, 18, 48, .94)),
        radial-gradient(circle at 84% 26%, rgba(20, 91, 238, .26), transparent 35%);
      box-shadow: 0 14px 34px rgba(0,0,0,.3);
    }

    .topbar::after {
      content: "";
      position: absolute;
      top: -42px;
      right: -70px;
      width: clamp(230px, 18vw, 330px);
      height: 170px;
      transform: skewX(-30deg);
      background: linear-gradient(90deg, rgba(2, 96, 240, .68) 0 45%, rgba(255, 102, 0, .96) 45% 63%, rgba(255, 102, 0, .18) 63%);
      pointer-events: none;
    }

    .brand-area {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: clamp(18px, 2vw, 30px);
      min-width: 0;
    }

    .brand-logo {
      width: clamp(165px, 14vw, 250px);
      height: auto;
      flex: 0 0 auto;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,.3));
    }

    .brand-divider {
      width: 1px;
      height: clamp(50px, 7vh, 68px);
      flex: 0 0 auto;
      background: linear-gradient(transparent, rgba(45, 137, 255, .75), transparent);
    }

    .heading-copy { min-width: 0; }

    .eyebrow {
      margin: 0;
      color: var(--blue-light);
      font-size: clamp(10px, .72vw, 12px);
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .titulo-principal {
      margin: 2px 0 4px;
      color: var(--white);
      font-size: clamp(28px, 2.7vw, 46px);
      line-height: .98;
      font-weight: 900;
      letter-spacing: -.04em;
      text-shadow: 0 5px 22px rgba(0,0,0,.45);
      white-space: nowrap;
    }

    .titulo-principal b {
      color: var(--orange-light);
      font-weight: 900;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: clamp(11px, .82vw, 14px);
      font-weight: 650;
    }

    .status-area {
      position: relative;
      z-index: 2;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      text-align: right;
    }

    .periodo-wrap { min-width: 0; }

    .periodo {
      color: var(--white);
      font-size: clamp(11px, .76vw, 14px);
      line-height: 1.15;
      font-weight: 850;
      letter-spacing: .02em;
      white-space: nowrap;
    }

    .ultima-atualizacao {
      max-width: 500px;
      margin-top: 5px;
      overflow: hidden;
      color: var(--muted);
      font-size: clamp(9px, .63vw, 11px);
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .live-badge {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 13px;
      color: #dbe9ff;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      backdrop-filter: blur(12px);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 12px rgba(36,223,141,.82);
      animation: pulse 1.7s ease-in-out infinite;
    }

    .live-badge.demo .live-dot {
      background: var(--orange-light);
      box-shadow: 0 0 12px rgba(255,173,40,.7);
    }

    .live-badge.error .live-dot {
      background: var(--danger);
      box-shadow: 0 0 12px rgba(255,95,109,.75);
    }

    @keyframes pulse {
      0%,100% { opacity: .5; transform: scale(.82); }
      50% { opacity: 1; transform: scale(1.16); }
    }

    .period-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-width: 0;
      padding: 10px 14px;
      border: 1px solid rgba(45, 129, 255, .32);
      border-radius: 6px 6px 16px 16px;
      background: linear-gradient(115deg, rgba(4, 27, 66, .91), rgba(2, 18, 48, .86));
      box-shadow: 0 10px 26px rgba(0,0,0,.18);
    }

    .semanas {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .semanas::-webkit-scrollbar { display: none; }

    .semana-btn {
      flex: 0 0 auto;
      min-width: 92px;
      height: 38px;
      padding: 0 13px;
      color: #b9c9df;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .035em;
      text-transform: uppercase;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 10px;
      background: rgba(255,255,255,.045);
      transition: transform .18s ease, color .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .semana-btn:hover {
      color: #fff;
      border-color: rgba(43,145,255,.7);
      background: rgba(8,103,232,.14);
      transform: translateY(-1px);
    }

    .semana-btn.active {
      color: #fff;
      border-color: rgba(255,114,0,.82);
      background: linear-gradient(135deg, rgba(8,103,232,.34), rgba(255,114,0,.22));
      box-shadow: inset 0 0 20px rgba(43,145,255,.08), 0 5px 16px rgba(0,0,0,.16);
    }

    .semana-btn[data-filtro="mes"] { min-width: 72px; }

    .month-filter {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 14px;
      border-left: 1px solid rgba(255,255,255,.12);
    }

    .month-filter label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    #mesSelect {
      min-width: 66px;
      height: 38px;
      padding: 0 28px 0 11px;
      color: #fff;
      font-size: 12px;
      font-weight: 850;
      cursor: pointer;
      outline: none;
      border: 1px solid rgba(43,145,255,.48);
      border-radius: 10px;
      background: var(--navy-850);
    }

    #mesSelect:focus { border-color: var(--orange); }
    #mesSelect option { color: #fff; background: var(--navy-900); }

    .painel {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(182px, 1fr));
      gap: var(--page-gap);
    }

    .card {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(45,129,255,.42);
      border-radius: 18px;
      background:
        radial-gradient(circle at 90% 0%, rgba(8,103,232,.16), transparent 34%),
        linear-gradient(145deg, rgba(6,29,72,.93), rgba(2,17,43,.97));
      box-shadow: 0 16px 34px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.025);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      z-index: 4;
      background: linear-gradient(90deg, var(--blue-light), rgba(43,145,255,.15) 45%, var(--orange));
      opacity: .88;
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      right: -68px;
      bottom: -76px;
      border: 24px solid rgba(255,114,0,.065);
      border-radius: 50%;
      pointer-events: none;
    }

    .equipe-card {
      display: grid;
      grid-template-rows: minmax(0, 1.35fr) minmax(67px, .65fr);
    }

    .equipe-topo {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(86px, 25%) minmax(0, 75%);
      align-items: center;
      gap: clamp(10px, 1vw, 18px);
      padding: clamp(10px, 1.15vh, 14px) clamp(12px, 1.1vw, 18px);
      border-bottom: 1px solid rgba(255,255,255,.09);
    }

    .logo-frame {
      position: relative;
      justify-self: center;
      width: min(100%, 112px);
      aspect-ratio: 1 / 1;
      padding: 7px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(43,145,255,.36);
      border-radius: 18px;
      background: rgba(255,255,255,.055);
      box-shadow: inset 0 0 22px rgba(43,145,255,.07), 0 8px 20px rgba(0,0,0,.2);
    }

    .logo-frame::after {
      content: "";
      position: absolute;
      inset: auto 12% 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--orange), transparent);
      box-shadow: 0 0 12px rgba(255,114,0,.48);
    }

    .logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      border-radius: 11px;
      filter: saturate(1.03) contrast(1.03);
    }

    .integrantes {
      min-width: 0;
      display: grid;
      align-content: center;
      gap: clamp(3px, .35vh, 6px);
    }

    .integrante {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(92px, 34%);
      align-items: baseline;
      column-gap: 12px;
      padding: 2px 0;
      font-size: clamp(12px, .84vw, 16px);
      line-height: 1.08;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
    }

    .nome {
      min-width: 0;
      overflow: hidden;
      color: var(--white);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .integrante:first-child .nome {
      color: var(--orange-light);
      font-weight: 850;
    }

    .valor-integrante {
      min-width: 0;
      color: #e6efff;
      text-align: right;
      white-space: nowrap;
      letter-spacing: -.01em;
    }

    .valor-integrante.loading {
      color: transparent;
      border-radius: 5px;
      background: linear-gradient(90deg, rgba(255,255,255,.05), rgba(255,255,255,.13), rgba(255,255,255,.05));
      background-size: 200% 100%;
      animation: shimmer 1.1s linear infinite;
    }

    @keyframes shimmer { to { background-position: -200% 0; } }

    .equipe-kpis {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr 1.06fr;
      padding: 8px 10px 9px;
      background: rgba(1,13,34,.34);
    }

    .kpi {
      position: relative;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
    }

    .kpi + .kpi::before {
      content: "";
      position: absolute;
      left: 0;
      top: 14%;
      bottom: 14%;
      width: 1px;
      background: rgba(255,255,255,.1);
    }

    .kpi-label {
      margin-bottom: 5px;
      color: var(--blue-light);
      font-size: clamp(8px, .62vw, 11px);
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .kpi-valor {
      color: var(--white);
      font-size: clamp(12px, 1vw, 19px);
      line-height: 1;
      font-weight: 900;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .kpi-valor.meta { color: var(--orange-light); }

    .percentual {
      color: var(--orange);
      font-size: clamp(25px, 2.15vw, 42px);
      line-height: .9;
      font-weight: 950;
      letter-spacing: -.045em;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 20px rgba(255,114,0,.18);
    }

    .marca-card {
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at center, rgba(8,103,232,.23), transparent 52%),
        linear-gradient(145deg, rgba(6,29,72,.96), rgba(2,17,43,.98));
    }

    .hud {
      position: relative;
      width: min(90%, 340px);
      height: 88%;
      min-height: 130px;
      display: grid;
      place-items: center;
    }

    .hud::before,
    .hud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(43,145,255,.34);
    }

    .hud::before { width: min(55%, 170px); aspect-ratio: 1; }
    .hud::after { width: min(42%, 132px); aspect-ratio: 1; border-style: dashed; opacity: .7; }

    .hud-ring {
      position: absolute;
      width: min(66%, 205px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: conic-gradient(from 25deg, transparent 0 16%, rgba(43,145,255,.72) 16% 17%, transparent 17% 42%, rgba(255,114,0,.8) 42% 43%, transparent 43% 78%, rgba(43,145,255,.58) 78% 79%, transparent 79% 100%);
      mask: radial-gradient(circle, transparent 0 45%, #000 46% 47%, transparent 48% 55%, #000 56% 57%, transparent 58%);
      animation: rotate 20s linear infinite;
    }

    @keyframes rotate { to { transform: rotate(360deg); } }

    .marca-conteudo {
      position: relative;
      z-index: 2;
      width: min(74%, 235px);
      display: grid;
      place-items: center;
      text-align: center;
    }

    .marca-logo {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 9px 18px rgba(0,0,0,.34));
    }

    .marca-nome { display: none; }

    .marca-sub {
      margin-top: 9px;
      color: var(--orange-light);
      font-size: clamp(8px, .6vw, 11px);
      font-weight: 850;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .total-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 18px;
      background:
        radial-gradient(ellipse at 50% 100%, rgba(8,103,232,.2), transparent 58%),
        linear-gradient(145deg, rgba(6,29,72,.95), rgba(2,17,43,.98));
    }

    .total-label {
      color: var(--blue-light);
      font-size: clamp(10px, .86vw, 16px);
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .total-valor {
      color: var(--white);
      font-size: clamp(36px, 3.55vw, 68px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -.045em;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 9px 28px rgba(0,0,0,.4);
    }

    .total-linha {
      width: min(73%, 280px);
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, var(--blue-light), var(--orange), transparent);
      box-shadow: 0 0 18px rgba(8,103,232,.3);
    }

    .total-info {
      color: var(--muted);
      font-size: clamp(8px, .57vw, 10px);
      font-weight: 700;
      letter-spacing: .06em;
      text-align: center;
      text-transform: uppercase;
    }

    .developer-credit {
      position: fixed;
      left: 50%;
      bottom: 5px;
      z-index: 1000;
      transform: translateX(-50%);
      color: rgba(168,186,212,.42);
      font-size: 8px;
      font-weight: 650;
      letter-spacing: .1em;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }

    @media (max-width: 1180px) {
      .shell { width: min(100% - 18px, 1180px); }
      .topbar { align-items: flex-start; flex-direction: column; }
      .topbar::after { right: -120px; }
      .status-area { width: 100%; justify-content: space-between; text-align: left; }
      .periodo { white-space: normal; }
      .ultima-atualizacao { white-space: normal; }
      .painel { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; grid-auto-rows: minmax(210px, auto); }
    }

    @media (max-width: 760px) {
      .shell { width: calc(100% - 14px); padding-top: 7px; padding-bottom: 28px; }
      .layout { min-height: auto; }
      .topbar { gap: 14px; padding: 15px; border-radius: 16px 16px 6px 6px; }
      .brand-area { width: 100%; gap: 13px; }
      .brand-logo { width: min(42vw, 175px); }
      .brand-divider { height: 46px; }
      .titulo-principal { font-size: clamp(22px, 7vw, 31px); white-space: normal; }
      .subtitle { display: none; }
      .status-area { align-items: flex-start; gap: 10px; }
      .live-badge { min-height: 32px; padding: 0 10px; }
      .period-toolbar { align-items: stretch; flex-direction: column; padding: 9px; }
      .semanas { width: 100%; }
      .semana-btn { min-width: 88px; height: 36px; font-size: 10px; }
      .month-filter { justify-content: space-between; padding: 8px 0 0; border-left: 0; border-top: 1px solid rgba(255,255,255,.1); }
      #mesSelect { min-width: 84px; }
      .painel { grid-template-columns: 1fr; grid-auto-rows: minmax(200px, auto); gap: 9px; }
      .equipe-topo { grid-template-columns: 88px minmax(0, 1fr); }
      .logo-frame { width: 84px; }
      .integrante { grid-template-columns: minmax(0, 1fr) minmax(88px, 34%); font-size: 12px; }
      .kpi-valor { font-size: 14px; }
      .percentual { font-size: 30px; }
      .marca-card { min-height: 215px; }
      .total-card { min-height: 180px; }
    }

    @media (max-width: 470px) {
      .brand-area { align-items: flex-start; flex-direction: column; }
      .brand-logo { width: 190px; }
      .brand-divider { display: none; }
      .eyebrow { margin-top: 2px; }
      .status-area { flex-direction: column; }
      .live-badge { align-self: flex-start; }
      .equipe-topo { grid-template-columns: 76px minmax(0, 1fr); gap: 10px; padding-inline: 10px; }
      .logo-frame { width: 72px; border-radius: 14px; }
      .integrante { grid-template-columns: minmax(0, 1fr) 86px; column-gap: 8px; font-size: 11.5px; }
      .equipe-kpis { padding-inline: 4px; }
      .kpi { padding-inline: 4px; }
      .kpi-label { letter-spacing: .04em; }
      .kpi-valor { font-size: 12px; }
      .percentual { font-size: 27px; }
      .total-valor { font-size: clamp(34px, 12vw, 50px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .live-dot, .hud-ring, .valor-integrante.loading { animation: none; }
      .semana-btn { transition: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="layout">
      <header class="topbar">
        <div class="brand-area">
          <img class="brand-logo" src="logoWhite.png" alt="UNIFAHE Faculdade a Distância">
          <span class="brand-divider" aria-hidden="true"></span>
          <div class="heading-copy">
            <p class="eyebrow">Central de resultados</p>
            <h1 class="titulo-principal">Performance <b>Comercial</b></h1>
            <p class="subtitle">Acompanhamento de resultados e desempenho por equipe</p>
          </div>
        </div>

        <div class="status-area">
          <div class="periodo-wrap">
            <div class="periodo" id="periodo">Carregando período</div>
            <div class="ultima-atualizacao" id="ultimaAtualizacao">Preparando painel...</div>
          </div>
          <div class="live-badge demo" id="liveBadge">
            <span class="live-dot"></span>
            <span id="liveTexto">Demonstração</span>
          </div>
        </div>
      </header>

      <div class="period-toolbar">
        <nav class="semanas" aria-label="Selecionar período">
          <button class="semana-btn" type="button" data-filtro="semana" data-semana="1">1ª semana</button>
          <button class="semana-btn" type="button" data-filtro="semana" data-semana="2">2ª semana</button>
          <button class="semana-btn" type="button" data-filtro="semana" data-semana="3">3ª semana</button>
          <button class="semana-btn" type="button" data-filtro="semana" data-semana="4">4ª semana</button>
          <button class="semana-btn" type="button" data-filtro="semana" data-semana="5">5ª semana</button>
          <button class="semana-btn" type="button" data-filtro="mes">Mês</button>
        </nav>
        <div class="month-filter">
          <label for="mesSelect">Mês-base</label>
          <select id="mesSelect" aria-label="Selecionar mês-base">
            <option value="1">01</option><option value="2">02</option><option value="3">03</option><option value="4">04</option><option value="5">05</option><option value="6">06</option><option value="7">07</option><option value="8">08</option><option value="9">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
          </select>
        </div>
      </div>

      <section class="painel" id="painel" aria-live="polite"></section>
    </div>
  </main>

  <script>
    const CONFIG = {
      // Cole aqui a URL publicada do Web App do Apps Script.
      API_URL: "https://script.google.com/macros/s/AKfycbzi-jbRSsxs-zLwMZ8ujKbNboKoQiyXYR0wdhLCOGwylcEajAaO7RR8mWadUDKM5tQ7/exec",

      // Atualização automática dos dados.
      INTERVALO_ATUALIZACAO_MS: 15000,

      // A página usa automaticamente o mês e o ano atuais.
      MES: new Date().getMonth() + 1,
      ANO: new Date().getFullYear()
    };

    const EQUIPES = [
      {
        id: "predadores",
        nome: "Predadores",
        logo: "assets/predadores.jpeg",
        integrantes: [
          ["Gabriel Gorgonio", 11216],

        ],
        integrantesSemana1: [

          ["Paola Fernandes", 8975],
          ["Jane menezes", 4449]
        ]
      },
      {
        id: "invictus",
        nome: "Invictus",
        logo: "assets/invictus.jpeg",
        integrantes: [
          ["Letícia Vieira", 19199],
          ["Vinicius Ribeiro", 20142],
          ["Chrystian", 7739],
          ["Melissa Ferreira", 4387]
        ],
        integrantesSemana1: [
          ["Letícia Goretti", 0],
          ["Ana Kelly", 3972],
          ["Ana Luiza", 1814],
          ["Leticia Pereira", 7454]
        ]
      },
      {
        id: "evolution",
        nome: "Evolution",
        logo: "assets/evolution.jpeg",
        integrantes: [
          ["Cauê Galates", 6803],
          ["Daniela Moura", 5709],
          ["Gabrielle Carvalho", 9047],
          ["Kevin Cristovão", 10202]
        ],
        integrantesSemana1: [
          ["Cauê Galates", 6803],
          ["Lara Baptista", 8984],
          ["Daniela Moura", 5709],
          ["Letícia Vieira", 19199]
        ]
      },
      {
        id: "vip",
        nome: "VIP",
        logo: "assets/vip.jpeg",
        integrantes: [
          ["Giseli de Jesus", 12367],
          ["Ana Kelly", 3972],
          ["Leticia Pereira", 7454],
          ["Carliane", 6893],
          ["Ana Luiza", 1814]
        ],
        integrantesSemana1: [
          ["Maria Laura", 13522],
          ["Gabriel Gorgonio", 11216],
          ["Raíssa Fontoura", 7267],
          ["Rodolfo Henrique", 4285]
        ]
      },
      {
        id: "winx",
        nome: "Winx",
        logo: "assets/winx.jpeg",
        integrantes: [
          ["Alana Santos", 15734],
          ["Camilly Longhi", 8922],
          ["Jane menezes", 4449],
          ["Paola Fernandes", 8975]
        ],
        integrantesSemana1: [
          ["Vinicius Ribeiro", 20142],
          ["Gabrielle Carvalho", 9047],
          ["Melissa Ferreira", 4387],
          ["Kevin Cristovão", 10202]
        ]
      },
      {
        id: "alfas",
        nome: "Alfas",
        logo: "assets/alfas.jpeg",
        integrantes: [
          ["Nathália", 8230],
          ["Fabiana Godoy", 6104],
          ["Bruna Moraes", 4104],
          ["Gabrielle Andrade", 11509]
        ],
        integrantesSemana1: [
          ["Fabiana Godoy", 6104],
          ["Bruna Moraes", 4104],
          ["Nathália", 8230],
          ["Gabrielle Andrade", 11509]
        ]
      },
      {
        id: "goat",
        nome: "Goat",
        logo: "assets/goat.jpeg",
        integrantes: [
          ["Beatriz Cunha", 17006],
          ["Lara Baptista", 8984],
          ["Lucas Eduardo", 6484],
          ["Estephany", 5286]
        ],
        integrantesSemana1: [
          ["Beatriz Cunha", 17006],
          ["Lucas Eduardo", 6484],
          ["Alana Santos", 15734],
          ["Eduardo Rogério", 0]
        ]
      }
    ];

    const NOMES_MESES = [
      "janeiro", "fevereiro", "março", "abril", "maio", "junho",
      "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"
    ];

    const FAIXAS_SEMANA = {
      1: [1, 4],
      2: [6, 11],
      3: [13, 18],
      4: [20, 25],
      5: [27, 31]
    };

    const painel = document.getElementById("painel");
    const periodoEl = document.getElementById("periodo");
    const ultimaAtualizacaoEl = document.getElementById("ultimaAtualizacao");
    const liveBadge = document.getElementById("liveBadge");
    const liveTexto = document.getElementById("liveTexto");
    const mesSelect = document.getElementById("mesSelect");
    if (mesSelect) {
      mesSelect.value = String(CONFIG.MES);
      mesSelect.addEventListener("change", event => {
        CONFIG.MES = Number(event.target.value);
        periodoServidor = null;
        atualizarCabecalho();
        atualizarDados();
      });
    }
    const botoesPeriodo = [...document.querySelectorAll(".semana-btn")];

    function descobrirSemanaAtualLocal(data = new Date()) {
      const dia = data.getDate();

      if (dia <= 5) return 1;
      if (dia <= 12) return 2;
      if (dia <= 19) return 3;
      if (dia <= 26) return 4;
      return 5;
    }

    let modoAtivo = "semana";
    let semanaAtiva = descobrirSemanaAtualLocal();
    let timerAtualizacao = null;
    let dadosAtuais = criarDadosDemonstracao();
    let metasAtuais = {};
    let membrosEquipesAtuais = null;
    let totaisEquipesAtuais = criarTotaisEquipesDemonstracao();
    let totalEquipesAtual = somarTotaisEquipes(totaisEquipesAtuais);
    let carregando = false;
    let requisicaoAtual = 0;
    let periodoServidor = null;

    function normalizarNome(valor) {
      return String(valor || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/\s+/g, " ")
        .trim();
    }

    function formatarMoeda(valor) {
      return `R$ ${Math.round(Number(valor) || 0).toLocaleString("pt-BR")}`;
    }

    function obterIntegrantesEquipe(equipe) {
      const membrosServidor = membrosEquipesAtuais?.[equipe.id];

      if (Array.isArray(membrosServidor)) {
        return membrosServidor.map(nome => [String(nome || "").trim(), 0]);
      }

      const usarPrimeiraSemana = modoAtivo === "semana" && semanaAtiva === 1;

      return usarPrimeiraSemana && Array.isArray(equipe.integrantesSemana1)
        ? equipe.integrantesSemana1
        : equipe.integrantes;
    }

    function criarDadosDemonstracao() {
      const vendedores = {};

      EQUIPES.forEach(equipe => {
        const listas = [equipe.integrantes, equipe.integrantesSemana1 || []];

        listas.flat().forEach(([nome, valor]) => {
          const chave = normalizarNome(nome);
          vendedores[chave] = Math.max(Number(vendedores[chave] || 0), Number(valor) || 0);
        });
      });

      return vendedores;
    }

    function criarTotaisEquipesDemonstracao() {
      const totais = {};

      EQUIPES.forEach(equipe => {
        totais[equipe.id] = obterIntegrantesEquipe(equipe).reduce(
          (total, [nome]) => total + Number(dadosAtuais?.[normalizarNome(nome)] || 0),
          0
        );
      });

      return totais;
    }

    function normalizarMembrosEquipes(membrosServidor) {
      const membros = {};

      Object.entries(membrosServidor || {}).forEach(([equipeId, nomes]) => {
        const chave = String(equipeId || "").trim().toLowerCase();
        if (!chave || !Array.isArray(nomes)) return;

        membros[chave] = nomes
          .map(nome => String(nome || "").trim())
          .filter(Boolean);
      });

      return membros;
    }

    function normalizarTotaisEquipes(equipesServidor) {
      const totais = {};

      Object.entries(equipesServidor || {}).forEach(([equipeId, valor]) => {
        const chave = String(equipeId || "").trim().toLowerCase();
        if (!chave) return;
        totais[chave] = Number(valor) || 0;
      });

      return totais;
    }

    function somarTotaisEquipes(equipes) {
      return Object.values(equipes || {}).reduce(
        (total, valor) => total + (Number(valor) || 0),
        0
      );
    }

    function normalizarMetas(metasServidor) {
      const metas = {};

      Object.entries(metasServidor || {}).forEach(([equipeId, valor]) => {
        const chave = String(equipeId || "").trim().toLowerCase();
        if (!chave) return;
        metas[chave] = Number(valor) || 0;
      });

      return metas;
    }

    function metaEquipe(equipe) {
      return Number(metasAtuais[equipe.id]) || 0;
    }

    function normalizarMapaVendedores(vendedores, vendedoresLista = []) {
      const mapa = {};

      Object.entries(vendedores || {}).forEach(([nome, valor]) => {
        const chave = normalizarNome(nome);
        const numero = Number(valor) || 0;

        if (!chave) return;

        // O Apps Script pode retornar o mesmo vendedor com o nome
        // original e também normalizado. Mantém apenas um valor.
        mapa[chave] = Math.max(Number(mapa[chave] || 0), numero);
      });

      (Array.isArray(vendedoresLista) ? vendedoresLista : []).forEach(item => {
        const chave = normalizarNome(item?.nome || item?.chave);
        const numero = Number(item?.total) || 0;

        if (!chave) return;
        mapa[chave] = Math.max(Number(mapa[chave] || 0), numero);
      });

      return mapa;
    }

    function valorVendedor(nome) {
      return Number(dadosAtuais[normalizarNome(nome)] || 0);
    }

    function valorEquipe(equipe) {
      return Number(totaisEquipesAtuais[equipe.id] || 0);
    }

    function criarCardEquipe(equipe) {
      const integrantes = obterIntegrantesEquipe(equipe);
      const realizado = valorEquipe(equipe);
      const meta = metaEquipe(equipe);
      const percentual = meta > 0 ? Math.round((realizado / meta) * 100) : 0;

      const linhas = integrantes.map(([nome]) => `
        <div class="integrante">
          <span class="nome" title="${nome}">${nome}</span>
          <span class="valor-integrante" data-vendedor="${normalizarNome(nome)}">${formatarMoeda(valorVendedor(nome))}</span>
        </div>
      `).join("");

      return `
        <article class="card equipe-card" data-equipe="${equipe.id}" aria-label="Equipe ${equipe.nome}">
          <div class="equipe-topo">
            <div class="logo-frame">
              <img src="${equipe.logo}" alt="Logo da equipe ${equipe.nome}">
            </div>
            <div class="integrantes">${linhas}</div>
          </div>
          <div class="equipe-kpis">
            <div class="kpi">
              <span class="kpi-label">Meta</span>
              <strong class="kpi-valor meta">${formatarMoeda(meta)}</strong>
            </div>
            <div class="kpi">
              <span class="kpi-label">Realizado</span>
              <strong class="kpi-valor" data-realizado="${equipe.id}">${formatarMoeda(realizado)}</strong>
            </div>
            <div class="kpi">
              <span class="kpi-label">Pontuação</span>
              <strong class="percentual" data-percentual="${equipe.id}">${percentual}%</strong>
            </div>
          </div>
        </article>
      `;
    }

    function renderizarPainel() {
      const totalGeral = Number(totalEquipesAtual) || 0;

      painel.innerHTML = `
        ${EQUIPES.slice(0, 6).map(criarCardEquipe).join("")}
        ${criarCardEquipe(EQUIPES[6])}

        <section class="card marca-card" aria-label="Marca central">
          <div class="hud">
            <div class="hud-ring"></div>
            <div class="marca-conteudo">
              <img class="marca-logo" src="logoWhite.png" alt="UNIFAHE Faculdade a Distância">
              <strong class="marca-nome">UNIFAHE</strong>
              <span class="marca-sub">Faculdade a distância</span>
            </div>
          </div>
        </section>

        <section class="card total-card" aria-label="Total geral">
          <span class="total-label">Total geral</span>
          <strong class="total-valor" id="totalGeral">${formatarMoeda(totalGeral)}</strong>
          <span class="total-linha" aria-hidden="true"></span>
          <span class="total-info">${modoAtivo === "mes" ? "Somatório do mês • segunda a sábado" : "Somatório da semana selecionada"}</span>
        </section>
      `;
    }

    function atualizarCabecalho(periodo = periodoServidor) {
      let inicio;
      let fim;
      let mes = CONFIG.MES;
      let ano = CONFIG.ANO;

      if (periodo) {
        mes = Number(periodo.mes || mes);
        ano = Number(periodo.ano || ano);
      }

      const ultimoDia = new Date(ano, mes, 0).getDate();

      if (modoAtivo === "mes") {
        periodoEl.textContent = `Mês completo • segunda a sábado • ${NOMES_MESES[mes - 1]} de ${ano}`;
      } else {
        if (periodo && Number(periodo.inicio) && Number(periodo.fim)) {
          inicio = Number(periodo.inicio);
          fim = Number(periodo.fim);
        } else {
          const faixa = FAIXAS_SEMANA[semanaAtiva] || FAIXAS_SEMANA[1];
          inicio = faixa[0];
          fim = Math.min(faixa[1], ultimoDia);
        }

        periodoEl.textContent = `${inicio.toString().padStart(2, "0")} a ${fim.toString().padStart(2, "0")} de ${NOMES_MESES[mes - 1]} de ${ano}`;
      }

      botoesPeriodo.forEach(botao => {
        const filtro = botao.dataset.filtro || "semana";
        const ativa = filtro === "mes"
          ? modoAtivo === "mes"
          : modoAtivo === "semana" && Number(botao.dataset.semana) === semanaAtiva;

        botao.classList.toggle("active", ativa);
        botao.setAttribute("aria-pressed", String(ativa));
      });
    }

    function apiConfigurada() {
      return /^https:\/\/script\.google\.com\//i.test(CONFIG.API_URL);
    }

    function definirStatus(tipo, texto, detalhe) {
      liveBadge.classList.remove("demo", "error");
      if (tipo === "demo") liveBadge.classList.add("demo");
      if (tipo === "error") liveBadge.classList.add("error");
      liveTexto.textContent = texto;
      ultimaAtualizacaoEl.textContent = detalhe;
    }

    function marcarCarregamento(ativo) {
      document.querySelectorAll(".valor-integrante").forEach(el => el.classList.toggle("loading", ativo));
    }

    function carregarJsonp(url, { modo, semana }, timeoutMs = 12000) {
      return new Promise((resolve, reject) => {
        const callback = `painelCallback_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement("script");
        const separador = url.includes("?") ? "&" : "?";
        const timeout = window.setTimeout(() => finalizar(new Error("Tempo limite excedido ao carregar os dados.")), timeoutMs);

        function finalizar(erro, dados) {
          window.clearTimeout(timeout);
          script.remove();
          try { delete window[callback]; } catch (_) { window[callback] = undefined; }
          erro ? reject(erro) : resolve(dados);
        }

        window[callback] = dados => finalizar(null, dados);
        script.onerror = () => finalizar(new Error("Não foi possível acessar o Apps Script."));

        const parametros = new URLSearchParams({
          rota: "equipes",
          callback,
          visao: modo,
          semana: String(semana),
          mes: String(CONFIG.MES),
          ano: String(CONFIG.ANO),
          _: String(Date.now())
        });

        script.src = `${url}${separador}${parametros.toString()}`;
        document.head.appendChild(script);
      });
    }

    async function atualizarDados({ silencioso = false } = {}) {
      const modoSolicitado = modoAtivo;
      const semanaSolicitada = semanaAtiva;
      const idRequisicao = ++requisicaoAtual;
      carregando = true;

      if (!apiConfigurada()) {
        dadosAtuais = criarDadosDemonstracao();
        metasAtuais = {};
        membrosEquipesAtuais = null;
        totaisEquipesAtuais = criarTotaisEquipesDemonstracao();
        totalEquipesAtual = somarTotaisEquipes(totaisEquipesAtuais);
        periodoServidor = null;
        renderizarPainel();
        atualizarCabecalho();
        definirStatus("demo", "Demonstração", "Configure a URL do Apps Script no index.html");
        carregando = false;
        return;
      }

      if (!silencioso) marcarCarregamento(true);
      const descricaoBusca = modoSolicitado === "mes"
        ? "Buscando o mês completo (segunda a sábado)..."
        : `Buscando dados da ${semanaSolicitada}ª semana...`;
      definirStatus("online", "Sincronizando", descricaoBusca);

      try {
        const resposta = await carregarJsonp(CONFIG.API_URL, {
          modo: modoSolicitado,
          semana: semanaSolicitada
        });
        const sucesso = resposta && (resposta.ok === true || resposta.sucesso === true);

        if (
          !sucesso ||
          !resposta.vendedores ||
          !resposta.equipes ||
          !resposta.membrosEquipes ||
          !Number.isFinite(Number(resposta.totalEquipes))
        ) {
          throw new Error(
            resposta?.erro ||
            resposta?.mensagem ||
            "O Apps Script precisa ser atualizado para enviar os totais das baias."
          );
        }

        // Ignora respostas antigas caso o usuário troque o período durante a busca.
        if (
          idRequisicao !== requisicaoAtual ||
          modoSolicitado !== modoAtivo ||
          (modoSolicitado === "semana" && semanaSolicitada !== semanaAtiva)
        ) return;

        dadosAtuais = normalizarMapaVendedores(
          resposta.vendedores,
          resposta.vendedoresLista
        );
        membrosEquipesAtuais = normalizarMembrosEquipes(
          resposta.membrosEquipes
        );
        totaisEquipesAtuais = normalizarTotaisEquipes(
          resposta.equipes
        );
        totalEquipesAtual = Number(resposta.totalEquipes) || 0;
        metasAtuais = normalizarMetas(resposta.metas);
        periodoServidor = resposta.periodo || null;
        renderizarPainel();
        atualizarCabecalho(periodoServidor);

        const horario = new Date().toLocaleTimeString("pt-BR", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });

        const periodoStatus = modoSolicitado === "mes"
          ? "Mês completo • segunda a sábado"
          : `${semanaSolicitada}ª semana`;

        definirStatus(
          "online",
          "Ao vivo",
          `${periodoStatus} • atualizado às ${horario} • atualização automática a cada ${CONFIG.INTERVALO_ATUALIZACAO_MS / 1000}s`
        );
      } catch (erro) {
        if (idRequisicao !== requisicaoAtual) return;
        renderizarPainel();
        atualizarCabecalho();
        definirStatus("error", "Falha na conexão", erro.message || "Erro ao atualizar os dados.");
        console.error(erro);
      } finally {
        if (idRequisicao === requisicaoAtual) {
          carregando = false;
          marcarCarregamento(false);
        }
      }
    }

    function programarAtualizacao() {
      window.clearInterval(timerAtualizacao);
      timerAtualizacao = window.setInterval(() => atualizarDados({ silencioso: true }), CONFIG.INTERVALO_ATUALIZACAO_MS);
    }

    botoesPeriodo.forEach(botao => {
      botao.addEventListener("click", () => {
        const filtro = botao.dataset.filtro || "semana";

        if (filtro === "mes") {
          modoAtivo = "mes";
        } else {
          const novaSemana = Number(botao.dataset.semana);
          if (!novaSemana) return;
          modoAtivo = "semana";
          semanaAtiva = novaSemana;
        }

        periodoServidor = null;
        atualizarCabecalho();
        atualizarDados();
      });
    });

    atualizarCabecalho();
    renderizarPainel();
    atualizarDados();
    programarAtualizacao();
  </script>
